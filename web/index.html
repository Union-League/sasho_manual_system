<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b4257">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sasho マニュアル">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Sasho マニュアル</title>
<style>
:root{
  --ink:#1a1a1a; --ink2:#4a4a4a; --ink3:#7a7a7a;
  --accent:#2b4257; --accent-l:#eaeef2; --accent-b:#c3ced8;
  --ng:#9c3428; --ng-bg:#fbf1ef; --ok:#2f6b4f; --ok-bg:#eff5f1;
  --warn:#8a6521; --warn-bg:#fbf6ea;
  --line:#e2e6ea; --paper:#f7f8f9; --bg:#fff;
  --hit:#fff6d5;
  --gothic:"Hiragino Sans","Yu Gothic Medium","Yu Gothic","Meiryo",system-ui,sans-serif;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --h:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--gothic);color:var(--ink);background:var(--bg);
  font-size:16px;line-height:1.8;-webkit-text-size-adjust:100%}

/* ── ヘッダー ── */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.97);
  backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line);
  padding:calc(8px + var(--h)) 12px 8px}
.bar{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto}
.brand{font-family:var(--mincho);font-size:15px;letter-spacing:.12em;color:var(--accent);
  white-space:nowrap;flex:0 0 auto}
.sbox{flex:1 1 auto;position:relative;display:flex;align-items:center}
#q{width:100%;font:inherit;font-size:17px;padding:12px 40px 12px 40px;
  border:1.5px solid var(--accent-b);border-radius:12px;background:var(--paper);color:var(--ink)}
#q:focus{outline:none;border-color:var(--accent);background:#fff}
.sbox::before{content:"";position:absolute;left:14px;width:15px;height:15px;
  border:2px solid var(--ink3);border-radius:50%;pointer-events:none}
.sbox::after{content:"";position:absolute;left:26px;top:26px;width:7px;height:2px;
  background:var(--ink3);transform:rotate(45deg);pointer-events:none}
#clr{position:absolute;right:6px;border:0;background:transparent;color:var(--ink3);
  font-size:24px;line-height:1;padding:6px 10px;cursor:pointer;display:none}
#clr.on{display:block}

/* ── 結果 ── */
main{max-width:900px;margin:0 auto;padding:0 12px 80px}
#res{padding-top:14px}
.rmeta{font-size:13px;color:var(--ink3);padding:2px 2px 10px}
.hit{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;margin-bottom:10px;
  background:#fff}
.hit:active{background:var(--paper)}
.hit .ht{font-size:16.5px;font-weight:700;line-height:1.5;margin-bottom:3px}
.hit .hg{font-size:12px;color:var(--accent);background:var(--accent-l);
  border-radius:4px;padding:2px 7px;display:inline-block;margin-bottom:6px}
.hit .hs{font-size:14px;color:var(--ink2);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:var(--hit);color:inherit;border-radius:2px;padding:0 1px}
.none{border:1px solid var(--warn-bg);background:var(--warn-bg);border-radius:10px;
  padding:16px;font-size:15px;line-height:1.85;color:var(--ink)}
.none b{color:var(--warn)}
.none .tips{margin:8px 0 0;padding-left:1.2em;font-size:14px;color:var(--ink2)}

/* ── 目次 ── */
.toc{margin:14px 0 4px}
.toc h2{font-family:var(--mincho);font-size:15px;letter-spacing:.16em;color:var(--accent);
  margin:0 0 8px;padding-bottom:6px;border-bottom:1.5px solid var(--accent)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:520px){.toc ol{grid-template-columns:1fr}}
.toc a{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fff;font-size:15px}
.toc a:active{background:var(--paper)}
.toc .n{flex:0 0 auto;font-family:var(--mincho);font-size:11px;color:#fff;background:var(--accent);
  border-radius:4px;padding:2px 6px}
.toc .c{flex:0 0 auto;margin-left:auto;font-size:12px;color:var(--ink3)}

/* ── 本文 ── */
.ch{margin:26px 0 0;scroll-margin-top:80px}
.ch-h{display:flex;align-items:baseline;gap:9px;margin:0 0 12px;padding-bottom:7px;
  border-bottom:2px solid var(--accent)}
.ch-n{font-family:var(--mincho);font-size:11px;letter-spacing:.1em;color:#fff;
  background:var(--accent);border-radius:4px;padding:3px 7px;flex:0 0 auto}
.ch-t{font-family:var(--mincho);font-size:20px;font-weight:600;letter-spacing:.05em}
.it{border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:11px;
  background:#fff;scroll-margin-top:78px;transition:background .5s,box-shadow .5s}
.it.flash{background:var(--hit);box-shadow:0 0 0 3px #f3dd93}
.it-h{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:700;
  line-height:1.5;margin-bottom:7px}
.it-h .id{flex:0 0 auto;margin-left:auto;font-size:11px;font-weight:400;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.it p{margin:0 0 7px;font-size:15.5px;line-height:1.85}
.it p:last-child{margin-bottom:0}
.note{background:var(--paper);border-left:3px solid var(--accent-b);border-radius:0 6px 6px 0;
  padding:9px 12px;margin:9px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink2)}
.danger{background:var(--ng-bg);border:1px solid #e6cdc8;border-left:4px solid var(--ng);
  border-radius:0 8px 8px 0;padding:11px 13px;margin:9px 0 0;font-size:15px;line-height:1.8}
.danger b{color:var(--ng)}
ol.cl{counter-reset:c;list-style:none;margin:10px 0 0;padding:0}
ol.cl li{counter-increment:c;position:relative;padding:0 0 9px 34px;font-size:15.5px;line-height:1.75}
ol.cl li:last-child{padding-bottom:0}
ol.cl li::before{content:counter(c);position:absolute;left:0;top:1px;width:23px;height:23px;
  border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.it.safety{border-left:4px solid var(--warn)}

/* ── 図表部品（図表シートの表示形式ごと） ── */
.fw{margin:11px 0 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
/* 幅を超えたら折り返して収める。それでも入らない表だけ .fw が横スクロールする */
table.fg{border-collapse:collapse;width:100%;font-size:14.5px;table-layout:auto}
table.fg th,table.fg td{border:1px solid var(--line);padding:9px 11px;text-align:left;
  vertical-align:top;line-height:1.7;word-break:break-word;overflow-wrap:anywhere}
table.fg th{background:var(--accent-l);color:var(--accent);font-weight:700;font-size:13px}
table.fg td:first-child{background:var(--paper);font-weight:600}
table.fg td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

/* 配置図：グループごとに縦積みの棚 */
.shelf{display:flex;gap:12px;margin:11px 0 0;flex-wrap:wrap}
.shelf .col{flex:1 1 160px;min-width:150px}
.shelf .cap{font-size:13px;font-weight:700;color:var(--accent);text-align:center;
  background:var(--accent-l);border:1px solid var(--accent-b);border-bottom:0;
  border-radius:8px 8px 0 0;padding:7px}
.shelf .cell{border:1px solid var(--accent-b);border-top:0;padding:10px 8px;text-align:center;
  background:#fff;font-size:15px;line-height:1.5}
.shelf .cell:last-child{border-radius:0 0 8px 8px}
.shelf .cell small{display:block;color:var(--ink3);font-size:11.5px;margin-bottom:2px}

/* 色見本 */
.sw{display:inline-block;width:17px;height:17px;border-radius:50%;
  border:1px solid rgba(0,0,0,.22);margin-right:8px;vertical-align:-3px;flex:0 0 auto}

/* 対比：対象ごとに列を作る */
.cmp{display:flex;gap:11px;margin:11px 0 0;flex-wrap:wrap}
.cmp .col{flex:1 1 240px;min-width:220px;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:#fff}
.cmp .ch2{background:var(--accent-l);color:var(--accent);font-weight:700;font-size:13.5px;
  padding:8px 11px;border-bottom:1px solid var(--line)}
.cmp ul{margin:0;padding:9px 11px 10px 26px;font-size:14.5px;line-height:1.75}
.cmp li{margin-bottom:5px}
.cmp li:last-child{margin-bottom:0}

/* タイムライン */
.tl{margin:11px 0 0;padding-left:3px;border-left:2px solid var(--accent-b)}
.tl .row{position:relative;display:flex;gap:11px;padding:0 0 12px 14px}
.tl .row:last-child{padding-bottom:0}
.tl .row::before{content:"";position:absolute;left:-6px;top:7px;width:9px;height:9px;
  border-radius:50%;background:var(--accent)}
.tl .tm{flex:0 0 92px;font-weight:700;color:var(--accent);font-size:14.5px}
.tl .ev{flex:1;font-size:15px;line-height:1.65}
.tl .ev small{display:block;color:var(--ink3);font-size:13px;margin-top:2px}
@media(max-width:420px){
  .tl .row{flex-direction:column;gap:2px}
  .tl .tm{flex:none}
}

/* ── 上に戻る ── */
#top{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--accent-b);background:rgba(255,255,255,.95);
  color:var(--accent);font-size:20px;cursor:pointer;display:none;
  box-shadow:0 2px 10px rgba(0,0,0,.12)}
#top.on{display:block}
footer{max-width:900px;margin:30px auto 0;padding:14px 12px calc(20px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);line-height:1.8}
.hide{display:none !important}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand">Sasho</div>
    <div class="sbox">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             placeholder="知りたいことを入力（例: キャンセル料）">
      <button id="clr" type="button" aria-label="消す">&times;</button>
    </div>
  </div>
</header>

<main>
  <div id="res"></div>
  <div id="browse"></div>
</main>

<button id="top" type="button" aria-label="上に戻る">↑</button>

<footer>
  <div id="foot"></div>
  マニュアルDBから自動生成されています。修正・追加の要望は経営陣へ。
</footer>

<script src="data.json.js"></script>
<script>
(function(){
  "use strict";
  var D = window.__SASHO__ || {genres:[],items:[]};
  var items = D.items, genres = D.genres;

  /* ── 日本語向け正規化：全角半角・大小・カタカナ→ひらがな ── */
  function norm(s){
    s = (s||"").normalize("NFKC").toLowerCase();
    var o = "";
    for (var i=0;i<s.length;i++){
      var c = s.charCodeAt(i);
      // カタカナ(ァ-ヶ) → ひらがな。「ダスター」と「だすたー」を同一視する
      o += (c >= 0x30A1 && c <= 0x30F6) ? String.fromCharCode(c - 0x60) : s[i];
    }
    return o;
  }
  items.forEach(function(it){
    it._t = norm(it.title);
    it._b = norm(it.body);
    it._k = norm(it.kw);
    it._c = norm(it.cl.join(" "));
    // 図表の中身も検索対象にする（「内容」を要約にしたため、これが無いと図表内の語で引けない）
    it._fg = (it.fg || []).map(function(r){ return r.join(" "); });
    it._f = norm(it._fg.join(" "));
  });

  function esc(s){ return (s||"").replace(/[&<>"]/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]; }); }
  /* 「内容」列の中の簡単な表・手順を組み上げる。
     ｜区切りが2行以上続く段落 → 表（1行目がヘッダー）
     ①②③… で始まる行だけの段落 → 番号付きリスト
     複雑な図表は別シート（ID○○）side で描くのでここでは扱わない */
  var STEP = /^(?:[①-⑳]|\d{1,2}[.．])\s*/;
  function nl2html(t){
    var bs = esc(t).split(/\n{2,}/).filter(Boolean);
    return bs.map(function(b){
      var ls = b.split("\n").filter(function(l){return l.trim();});

      if (ls.length >= 2 && ls.every(function(l){ return l.indexOf("｜") >= 0; })){
        var cells = ls.map(function(l){ return l.split("｜").map(function(c){ return c.trim(); }); });
        var head = cells[0], n = 0;
        cells.forEach(function(r){ if (r.length > n) n = r.length; });
        var h = ['<div class="fw"><table class="fg"><thead><tr>'];
        for (var i=0;i<n;i++) h.push('<th>'+(head[i]||"")+'</th>');
        h.push('</tr></thead><tbody>');
        cells.slice(1).forEach(function(r){
          h.push('<tr>');
          for (var i=0;i<n;i++){
            var v = r[i] || "";
            h.push('<td'+(i>0 && isNum(v) ? ' class="num"' : '')+'>'+v+'</td>');
          }
          h.push('</tr>');
        });
        h.push('</tbody></table></div>');
        return h.join("");
      }

      if (ls.length >= 2 && ls.every(function(l){ return STEP.test(l.trim()); })){
        return '<ol class="cl">' + ls.map(function(l){
          return '<li>' + l.trim().replace(STEP, "").trim() + '</li>'; }).join("") + '</ol>';
      }

      // 【背景】以降はそのまま補足ボックスに入れる（段落の途中から始まる場合も）
      var ni = -1;
      for (var i=0;i<ls.length;i++){ if (/^【/.test(ls[i].trim())) { ni = i; break; } }
      if (ni >= 0){
        var pre = ls.slice(0, ni), post = ls.slice(ni);
        return (pre.length ? '<p>'+pre.join("<br>")+'</p>' : '')
             + '<div class="note">' + post.join("<br>") + '</div>';
      }

      var h2 = ls.join("<br>");
      // 【背景】【要確認】等で始まる段落は補足ボックスにする
      return /^【/.test(b.trim()) ? '<div class="note">'+h2+'</div>' : '<p>'+h2+'</p>';
    }).join("");
  }

  /* ── 検索：空白区切りはAND。タイトル>キーワード>本文>CL項目 で重み付け ── */
  function search(qs){
    var terms = norm(qs).split(/[\s　]+/).filter(Boolean);
    if (!terms.length) return null;
    var out = [];
    items.forEach(function(it){
      var sc = 0, ok = true;
      terms.forEach(function(t){
        var s = 0;
        if (it._t.indexOf(t) >= 0) s += 100;
        if (it._k.indexOf(t) >= 0) s += 50;
        if (it._b.indexOf(t) >= 0) s += 20;
        if (it._f.indexOf(t) >= 0) s += 18;
        if (it._c.indexOf(t) >= 0) s += 14;
        if (!s) ok = false;
        sc += s;
      });
      if (ok) out.push({it:it, sc:sc});
    });
    out.sort(function(a,b){ return b.sc - a.sc || a.it.id - b.it.id; });
    return {terms:terms, hits:out};
  }

  /* 一致箇所を含む抜粋を作る（本文→CL項目の順で探す） */
  function snippet(it, terms){
    var src = it.body.replace(/｜/g," ").replace(/\s+/g," ").trim();
    var hay = norm(src), pos = -1, hitTerm = "";
    for (var i=0;i<terms.length;i++){
      var p = hay.indexOf(terms[i]);
      if (p >= 0 && (pos < 0 || p < pos)) { pos = p; hitTerm = terms[i]; }
    }
    // 本文に無ければ 図表の行 → CL項目 の順に一致箇所を探す
    var pools = [it._fg || [], it.cl || []];
    for (var pi=0; pi<pools.length && pos<0; pi++){
      var pool = pools[pi];
      for (var j=0;j<pool.length;j++){
        var ch = norm(pool[j]);
        for (var k=0;k<terms.length;k++){
          if (ch.indexOf(terms[k]) >= 0){ src = pool[j]; hay = ch; pos = ch.indexOf(terms[k]); hitTerm = terms[k]; break; }
        }
        if (pos >= 0) break;
      }
    }
    if (pos < 0) return esc(src.slice(0,90));
    var st = Math.max(0, pos - 28);
    var frag = (st > 0 ? "…" : "") + src.slice(st, st + 110);
    var out = esc(frag), nf = norm(frag), at = nf.indexOf(hitTerm);
    if (at >= 0) out = esc(frag.slice(0,at)) + "<mark>" + esc(frag.slice(at, at+hitTerm.length)) + "</mark>" + esc(frag.slice(at+hitTerm.length));
    return out;
  }

  var elQ = document.getElementById("q"), elClr = document.getElementById("clr"),
      elRes = document.getElementById("res"), elBrowse = document.getElementById("browse"),
      elTop = document.getElementById("top");

  /* ?only=28,5 で指定IDだけを表示（見た目の確認用・特定項目の共有用） */
  var ONLY = (function(){
    var m = /[?&]only=([\d,]+)/.exec(location.search);
    return m ? m[1].split(",").filter(Boolean).map(Number) : null;
  })();

  /* ── 一覧（目次＋全文）を描く ── */
  function renderBrowse(){
    if (ONLY){
      elBrowse.innerHTML = items.filter(function(it){ return ONLY.indexOf(it.id) >= 0; })
        .map(function(it){ return card(it); }).join("");
      return;
    }
    var h = ['<nav class="toc"><h2>目次</h2><ol>'];
    genres.forEach(function(g,i){
      var n = items.filter(function(it){return it.genre===g;}).length;
      h.push('<li><a href="#ch'+(i+1)+'"><span class="n">'+(i+1)+'</span><span>'+esc(g)+'</span><span class="c">'+n+'</span></a></li>');
    });
    h.push('</ol></nav>');
    genres.forEach(function(g,i){
      var list = items.filter(function(it){return it.genre===g;});
      h.push('<section class="ch" id="ch'+(i+1)+'"><h2 class="ch-h"><span class="ch-n">第'+(i+1)+'章</span><span class="ch-t">'+esc(g)+'</span></h2>');
      list.forEach(function(it){ h.push(card(it)); });
      h.push('</section>');
    });
    elBrowse.innerHTML = h.join("");
  }
  /* ── 図表シートの表示形式ごとに描く ── */
  var isNum = function(s){ return /^[¥￥$]?[\d,]+(\.\d+)?$/.test((s||"").trim()) || /^[+\-][¥￥$]?[\d,]/.test((s||"").trim()); };

  function figure(kind, rows){
    if (!rows || !rows.length) return "";
    switch (kind){

      case "表":
      case "対応表": {
        var head = rows[0], body = rows.slice(1);
        var h = ['<div class="fw"><table class="fg"><thead><tr>'];
        head.forEach(function(c){ h.push('<th>'+esc(c)+'</th>'); });
        h.push('</tr></thead><tbody>');
        body.forEach(function(r){
          h.push('<tr>');
          for (var i=0;i<head.length;i++){
            var v = r[i] || "";
            h.push('<td'+(i>0 && isNum(v) ? ' class="num"' : '')+'>'+esc(v)+'</td>');
          }
          h.push('</tr>');
        });
        h.push('</tbody></table></div>');
        return h.join("");
      }

      case "配置図": {
        // セル1=グループ / セル2=位置ラベル / セル3=中身
        var order = [], byg = {};
        rows.forEach(function(r){
          var g = r[0] || "";
          if (!byg[g]) { byg[g] = []; order.push(g); }
          byg[g].push({pos:r[1]||"", val:r[2]||""});
        });
        var h = ['<div class="shelf">'];
        order.forEach(function(g){
          h.push('<div class="col"><div class="cap">'+esc(g)+'</div>');
          byg[g].forEach(function(c){
            h.push('<div class="cell">'+(c.pos?'<small>'+esc(c.pos)+'</small>':'')+esc(c.val)+'</div>');
          });
          h.push('</div>');
        });
        h.push('</div>');
        return h.join("");
      }

      case "色見本": {
        // セル1=色名 / セル2=カラーコード / セル3=用途
        var h = ['<div class="fw"><table class="fg"><thead><tr><th>色</th><th>用途</th></tr></thead><tbody>'];
        rows.forEach(function(r){
          var sw = /^#[0-9a-fA-F]{3,8}$/.test((r[1]||"").trim())
                 ? '<span class="sw" style="background:'+esc(r[1])+'"></span>' : '';
          h.push('<tr><td style="white-space:nowrap">'+sw+esc(r[0])+'</td><td>'+esc(r[2]||"")+'</td></tr>');
        });
        h.push('</tbody></table></div>');
        return h.join("");
      }

      case "対比": {
        // セル1=対象 / セル2=項目（1項目1行）
        var order2 = [], by = {};
        rows.forEach(function(r){
          var k = r[0] || "";
          if (!by[k]) { by[k] = []; order2.push(k); }
          if (r[1]) by[k].push(r[1]);
        });
        var h = ['<div class="cmp">'];
        order2.forEach(function(k){
          h.push('<div class="col"><div class="ch2">'+esc(k)+'</div><ul>');
          by[k].forEach(function(v){ h.push('<li>'+esc(v)+'</li>'); });
          h.push('</ul></div>');
        });
        h.push('</div>');
        return h.join("");
      }

      case "タイムライン": {
        // セル1=時刻/見出し / セル2=内容 / セル3=補足
        var h = ['<div class="tl">'];
        rows.forEach(function(r){
          h.push('<div class="row"><div class="tm">'+esc(r[0]||"")+'</div><div class="ev">'
            + esc(r[1]||"") + (r[2] ? '<small>'+esc(r[2])+'</small>' : '') + '</div></div>');
        });
        h.push('</div>');
        return h.join("");
      }

      case "手順": {
        var h = ['<ol class="cl">'];
        rows.forEach(function(r){ h.push('<li>'+esc(r[0]||"")+'</li>'); });
        h.push('</ol>');
        return h.join("");
      }

      default: {
        // 未知の表示形式は表として描く（落とさない）
        var h = ['<div class="fw"><table class="fg"><tbody>'];
        rows.forEach(function(r){
          h.push('<tr>');
          r.forEach(function(c){ h.push('<td>'+esc(c)+'</td>'); });
          h.push('</tr>');
        });
        h.push('</tbody></table></div>');
        return h.join("");
      }
    }
  }

  function card(it){
    var safety = (it.genre === "安全管理");
    var h = ['<article class="it'+(safety?' safety':'')+'" id="id-'+it.id+'">',
             '<h3 class="it-h"><span>'+esc(it.title)+'</span><span class="id">'+it.id+'</span></h3>',
             nl2html(it.body)];
    if (it.fg && it.fg.length) h.push(figure(it.fk, it.fg));
    if (it.cl.length){
      h.push('<ol class="cl">');
      it.cl.forEach(function(c){ h.push('<li>'+esc(c)+'</li>'); });
      h.push('</ol>');
    }
    h.push('</article>');
    return h.join("");
  }

  /* ── 検索結果を描く ── */
  function renderRes(qs){
    var r = search(qs);
    if (!r){ elRes.innerHTML = ""; elBrowse.classList.remove("hide"); return; }
    elBrowse.classList.add("hide");
    if (!r.hits.length){
      elRes.innerHTML = '<div class="none"><b>該当する項目は見つかりませんでした。</b>'
        + '<ul class="tips"><li>言い方を変えてみてください（例:「代金」→「料金」「いくら」）</li>'
        + '<li>単語を短く、1語だけで試してみてください</li>'
        + '<li>それでも無い場合、マニュアルに未記載の可能性があります。経営陣へご連絡ください</li></ul></div>';
      return;
    }
    var h = ['<div class="rmeta">'+r.hits.length+'件見つかりました</div>'];
    r.hits.slice(0,40).forEach(function(o){
      h.push('<a class="hit" href="#id-'+o.it.id+'" data-id="'+o.it.id+'">'
        + '<span class="hg">'+esc(o.it.genre)+'</span>'
        + '<div class="ht">'+esc(o.it.title)+'</div>'
        + '<div class="hs">'+snippet(o.it, r.terms)+'</div></a>');
    });
    if (r.hits.length > 40) h.push('<div class="rmeta">上位40件を表示しています。語を足すと絞り込めます。</div>');
    elRes.innerHTML = h.join("");
  }

  /* 結果をタップ → 一覧に戻して該当項目へ飛び、一瞬光らせる */
  elRes.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest("a.hit") : null;
    if (!a) return;
    e.preventDefault();
    var id = a.getAttribute("data-id");
    elQ.value = ""; elClr.classList.remove("on");
    elRes.innerHTML = ""; elBrowse.classList.remove("hide");
    jump(id);
  });

  function jump(id){
    var el = document.getElementById("id-" + id);
    if (!el) return;
    el.scrollIntoView({block:"start"});
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1600);
    if (history.replaceState) history.replaceState(null, "", "#id-" + id);
  }

  var t = null;
  elQ.addEventListener("input", function(){
    elClr.classList.toggle("on", !!elQ.value);
    clearTimeout(t);
    t = setTimeout(function(){ renderRes(elQ.value); }, 90);
  });
  elQ.addEventListener("keydown", function(e){ if (e.key === "Enter") elQ.blur(); });
  elClr.addEventListener("click", function(){
    elQ.value = ""; elClr.classList.remove("on"); renderRes(""); elQ.focus();
  });

  elTop.addEventListener("click", function(){ window.scrollTo({top:0}); });
  window.addEventListener("scroll", function(){
    elTop.classList.toggle("on", window.scrollY > 500);
  }, {passive:true});

  renderBrowse();
  document.getElementById("foot").textContent =
    "全" + items.length + "項目・" + genres.length + "章／" + (D.generated || "");

  /* URLに #id-51 が付いていれば直接その項目へ */
  if (/^#id-\d+$/.test(location.hash)) {
    setTimeout(function(){ jump(location.hash.replace("#id-","")); }, 60);
  }
})();
</script>
</body>
</html>
